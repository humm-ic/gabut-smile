<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Smile Lyrics Motion</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    /* =========================================================
       ROOT
    ========================================================= */

    :root{

      --font-lyric:
      'Bebas Neue',
      sans-serif;

      --font-ui:
      'DM Mono',
      monospace;

      --safe-padding:80px;

      --safe-gap:40px;

      --accent: #ffffff;

    }

    /* =========================================================
       HTML BODY
    ========================================================= */

    html,
    body{

      width:100%;
      height:100%;

      overflow:hidden;

      background:#050505;

      -webkit-font-smoothing:
      antialiased;

      text-rendering:
      optimizeLegibility;

    }

    body{

      position:relative;

      background:

      radial-gradient(
      circle at top left,
      rgba(255,255,255,.05),
      transparent 30%
      ),

      radial-gradient(
      circle at bottom right,
      rgba(255,255,255,.04),
      transparent 30%
      ),

      #050505;

    }

    /* =========================================================
       STAGE
    ========================================================= */

    #stage{

      position:relative;

      width:100%;
      height:100dvh;

      overflow:hidden;
      opacity: 0;
      transition: opacity 2s ease;

    }

    #stage.active {
      opacity: 1;
    }

    /* =========================================================
       OVERLAY / ENTRY
    ========================================================= */

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: pointer;
      transition: opacity 1s ease, visibility 1s;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .enter-btn {
      color: white;
      font-family: var(--font-ui);
      font-size: 12px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      padding: 20px 40px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(10px);
      transition: all 0.4s ease;
    }

    #overlay:hover .enter-btn {
      background: rgba(255,255,255,0.1);
      letter-spacing: 0.7em;
      border-color: rgba(255,255,255,0.5);
    }

    /* =========================================================
       GLOW
    ========================================================= */

    .glow{

      position:absolute;

      width:900px;
      height:900px;

      border-radius:50%;

      top:50%;
      left:50%;

      transform:
      translate(-50%,-50%);

      background:

      radial-gradient(
      circle,
      rgba(255,255,255,.06),
      transparent 70%
      );

      filter:blur(90px);

      animation:
      pulse 8s ease-in-out infinite;

      pointer-events:none;

      z-index:1;

    }

    @keyframes pulse{

      0%,100%{

        transform:
        translate(-50%,-50%)
        scale(1);

      }

      50%{

        transform:
        translate(-50%,-50%)
        scale(1.15);

      }

    }

    /* =========================================================
       VIGNETTE
    ========================================================= */

    .vignette{

      position:absolute;

      inset:0;

      pointer-events:none;

      z-index:2;

      background:

      linear-gradient(
      to bottom,
      rgba(0,0,0,.88),
      transparent 20%,
      transparent 80%,
      rgba(0,0,0,.88)
      ),

      linear-gradient(
      to right,
      rgba(0,0,0,.7),
      transparent 14%,
      transparent 86%,
      rgba(0,0,0,.7)
      );

    }

    /* =========================================================
       WORDS LAYER
    ========================================================= */

    #words-layer{

      position:absolute;

      inset:0;

      z-index:5;

    }

    /* =========================================================
       WORD
    ========================================================= */

    .word{

      position:absolute;

      color:white;

      font-family:
      var(--font-lyric);

      text-transform:uppercase;

      line-height:.9;

      letter-spacing:-0.02em;

      white-space:nowrap;

      user-select:none;

      opacity:0;

      max-width:80vw;

      overflow-wrap:break-word;

      will-change:
      transform,
      opacity,
      filter;

      text-shadow:

      0 0 20px
      rgba(255,255,255,.15),

      0 0 80px
      rgba(255,255,255,.08);

    }

    .vertical{

      writing-mode:
      vertical-rl;

      text-orientation:
      mixed;

    }

    /* =========================================================
       TOP COUNTER
    ========================================================= */

    #counter{

      position:absolute;

      top:35px;
      left:35px;

      z-index:20;

      color:
      rgba(255,255,255,.3);

      font-family:
      var(--font-ui);

      font-size:10px;

      letter-spacing:.3em;

    }

    /* =========================================================
       MUSIC BARS
    ========================================================= */

    .bars{

      position:absolute;

      top:35px;
      right:35px;

      z-index:20;

      display:flex;

      align-items:flex-end;

      gap:5px;

      height:35px;

    }

    .bars span{

      width:3px;

      border-radius:20px;

      background:white;

      animation:
      bars 1s ease-in-out infinite;
      animation-play-state: paused;

    }

    .bars.playing span {
      animation-play-state: running;
    }

    .bars span:nth-child(1){
      height:10px;
    }

    .bars span:nth-child(2){
      height:22px;
      animation-delay:.1s;
    }

    .bars span:nth-child(3){
      height:14px;
      animation-delay:.2s;
    }

    .bars span:nth-child(4){
      height:30px;
      animation-delay:.3s;
    }

    .bars span:nth-child(5){
      height:18px;
      animation-delay:.4s;
    }

    @keyframes bars{

      0%,100%{

        transform:scaleY(.4);
        opacity:.3;

      }

      50%{

        transform:scaleY(1);
        opacity:1;

      }

    }

    /* =========================================================
       UI
    ========================================================= */

    .ui{

      position:absolute;

      left:35px;
      bottom:35px;

      z-index:20;

    }

    .ui-label{

      color:
      rgba(255,255,255,.3);

      font-size:10px;

      letter-spacing:.4em;

      text-transform:uppercase;

      font-family:
      var(--font-ui);

      margin-bottom:8px;

    }

    .ui-title{

      color:
      rgba(255,255,255,.65);

      font-size:13px;

      font-family:
      var(--font-ui);

    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media screen and (max-width:1200px){

      :root{

        --safe-padding:65px;
        --safe-gap:34px;

      }

    }

    @media screen and (max-width:992px){

      :root{

        --safe-padding:50px;
        --safe-gap:28px;

      }

      .glow{

        width:700px;
        height:700px;

      }

    }

    @media screen and (max-width:768px){

      :root{

        --safe-padding:40px;
        --safe-gap:24px;

      }

      .word{

        max-width:85vw;

      }

      .glow{

        width:600px;
        height:600px;

      }

      #counter{

        top:20px;
        left:20px;

        font-size:8px;

      }

      .bars{

        top:20px;
        right:20px;

        transform:scale(.8);

      }

      .ui{

        left:20px;
        bottom:20px;

      }

      .ui-label{

        font-size:8px;

      }

      .ui-title{

        font-size:11px;

      }

    }

    @media screen and (max-width:480px){

      :root{

        --safe-padding:26px;
        --safe-gap:18px;

      }

      .word{

        max-width:90vw;

      }

      .glow{

        width:420px;
        height:420px;

      }

    }

    @media screen and (max-height:500px){

      :root{

        --safe-padding:18px;
        --safe-gap:14px;

      }

      .glow{

        width:380px;
        height:380px;

      }

    }

  </style>
</head>

<body>

<div id="overlay">
  <div class="enter-btn">Click to Play</div>
</div>

<section id="stage">

  <!-- GLOW -->
  <div class="glow"></div>

  <!-- VIGNETTE -->
  <div class="vignette"></div>

  <!-- WORDS -->
  <div id="words-layer"></div>

  <!-- COUNTER -->
  <div id="counter">
    00 / 00
  </div>

  <!-- MUSIC -->
  <div id="bars" class="bars">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>

  <!-- UI -->
  <div class="ui">

    <div class="ui-label">
      NOW PLAYING
    </div>

    <div class="ui-title">
      Smile • Steve Chris, Venes
    </div>

  </div>

</section>

<!-- AUDIO ELEMENT -->
<audio id="audio" src="smile.mp3" loop preload="auto"></audio>

<script>

  /* =========================================================
     SYCHRONIZED LYRICS
  ========================================================= */

  const syncedLyrics = [
    { time: 10.0, text: "Smile we got sunshine in our soul" },
    { time: 13.5, text: "Count your blessings, let it glow" },
    { time: 16.8, text: "Life's a ride, just take it slow (Ooo...)" },
    { time: 21.2, text: "Every heartbeat's made of gold" },

    { time: 23.5, text: "When the rain comes, I still dance" },
    { time: 26.8, text: "Every drop's another chance" },
    { time: 30.2, text: "Thank you, life, for what I got" },
    { time: 33.5, text: "Even when I don't have a lot" },

    { time: 38.0, text: "Every heartbeat's made of gold" },
    { time: 40.0, text: "Every heartbeat's made of gold" },
    { time: 42.0, text: "Every heartbeat's made of gold" },
    { time: 43.8, text: "Every heartbeat's made of gold" },

    { time: 45.8, text: "Got a smile on ma on ma on ma on ma on ma face" },
    { time: 48.5, text: "Got a smile on ma on ma on ma on ma on ma face" },
    { time: 51.5, text: "Got a smile on ma on ma on ma on ma on ma face" },
    { time: 54.0, text: "Got a smile on ma on ma on ma on ma on ma face" },

    { time: 59.8, text: "Got a smile on ma face, even when times are hard" },
    { time: 62.5, text: "Got a smile on ma face, even when times are hard" },
    { time: 65.8, text: "Got a smile on ma face, even when times are hard" },
    { time: 70.2, text: "Got a smile on ma face, even when times are hard" },

    { time: 75.5, text: "Morning light, another chance to grow" },
    { time: 79.5, text: "Little wins, that's all we need to know" },
    { time: 82.8, text: "Grateful hearts make the world spin fast" },
    { time: 86.0, text: "Every laugh's gonna make it last" },

    { time: 90.2, text: "When the rain comes, I still dance" },
    { time: 93.5, text: "Every drop's another chance" },
    { time: 96.8, text: "Thank you, life, for what I got" },
    { time: 100.2, text: "Even when I don't have a lot" },

    { time: 102.5, text: "Every heartbeat's made of gold" },
    { time: 104.5, text: "Every heartbeat's made of gold" },
    { time: 106.5, text: "Every heartbeat's made of gold" },
    { time: 109.5, text: "Every heartbeat's made of gold" },

    { time: 111.0, text: "Got a smile on ma on ma on ma on ma on ma face" },
    { time: 114.2, text: "Got a smile on ma on ma on ma on ma on ma face" },
    { time: 116.5, text: "Got a smile on ma on ma on ma on ma on ma face" },
    { time: 119.0, text: "Got a smile on ma on ma on ma on ma on ma face" },

    { time: 122.5, text: "Got a smile on ma face, even when times are hard" },
    { time: 127.5, text: "Got a smile on ma face, even when times are hard" },
    { time: 130.8, text: "Got a smile on ma face, even when times are hard" },
    { time: 134.2, text: "Got a smile on ma face, even when times are hard" },

  ];

  /* =========================================================
     ELEMENTS
  ========================================================= */

  const stage = document.getElementById("stage");
  const layer = document.getElementById("words-layer");
  const counter = document.getElementById("counter");
  const overlay = document.getElementById("overlay");
  const audio = document.getElementById("audio");
  const bars = document.getElementById("bars");

  /* =========================================================
     SETTINGS
  ========================================================= */

  const FONT_SIZES = [24, 32, 48, 64, 84, 110];
  let currentLyricIndex = -1;
  let activeBoxes = [];

  /* =========================================================
     RANDOM
  ========================================================= */

  function rnd(min,max){
    return Math.random() * (max - min) + min;
  }

  /* =========================================================
     GET RESPONSIVE PADDING / GAP
  ========================================================= */

  function getPadding(){
    return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-padding'));
  }

  function getGap(){
    return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-gap'));
  }

  /* =========================================================
     COLLISION
  ========================================================= */

  function isColliding(box){
    const gap = getGap();
    return activeBoxes.some(item => {
      return !(
        box.right + gap < item.left ||
        box.left - gap > item.right ||
        box.bottom + gap < item.top ||
        box.top - gap > item.bottom
      );
    });
  }

  /* =========================================================
     SAFE POSITION
  ========================================================= */

  function getSafePosition(width, height){
    const padding = getPadding();
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    let tries = 0;

    while(tries < 1000){
      const x = rnd(padding, W - width - padding);
      const y = rnd(padding, H - height - padding);

      const box = {
        left:x, top:y,
        right:x + width,
        bottom:y + height
      };

      const inside = box.left >= padding && box.top >= padding && box.right <= W - padding && box.bottom <= H - padding;

      if(inside && !isColliding(box)){
        activeBoxes.push(box);
        return { x, y, box };
      }
      tries++;
    }

    return { x:padding, y:padding, box:null };
  }

  /* =========================================================
     CREATE WORD
  ========================================================= */

  function createWord(word){
    const el = document.createElement("div");
    el.classList.add("word");

    if(word.length <= 4 && Math.random() > .94){
      el.classList.add("vertical");
    }

    el.innerText = word.toUpperCase();

    const mobile = window.innerWidth < 768;
    const sizes = mobile ? [20,28,36,52,70] : FONT_SIZES;
    const size = sizes[Math.floor(Math.random() * sizes.length)];
    el.style.fontSize = `${size}px`;

    layer.appendChild(el);

    const rect = el.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;

    const position = getSafePosition(width, height);
    el.style.left = `${position.x}px`;
    el.style.top = `${position.y}px`;

    const rotate = rnd(-8,8);

    gsap.fromTo(el,
      { opacity:0, y:60, scale:.5, rotate, filter: "blur(20px)" },
      { opacity:1, y:0, scale:1, rotate, filter: "blur(0px)", duration:1, ease:"power4.out" }
    );

    gsap.to(el,{
      x:`+=${rnd(-6,6)}`, y:`+=${rnd(-6,6)}`,
      duration:rnd(2,4), repeat:-1, yoyo:true, ease:"sine.inOut"
    });

    gsap.to(el,{
      opacity:0, scale:1.15, filter: "blur(18px)",
      duration:1, delay:2.5, ease:"power2.out",
      onComplete:()=>{
        if(position.box){
          activeBoxes = activeBoxes.filter(box => box !== position.box);
        }
        el.remove();
      }
    });
  }

  /* =========================================================
     PLAY LYRIC LINE
  ========================================================= */

  function displayLyric(index){
    const data = syncedLyrics[index];
    if(!data) return;

    activeBoxes = [];
    const words = data.text.split(" ");

    counter.innerText = `${String(index + 1).padStart(2,"0")} / ${syncedLyrics.length}`;

    words.forEach((word, i) => {
      setTimeout(() => {
        createWord(word);
      }, i * 200);
    });
  }

  /* =========================================================
     SYNC LOGIC
  ========================================================= */

  audio.addEventListener('timeupdate', () => {
    const currentTime = audio.currentTime;

    // Find the current lyric based on time
    let foundIndex = -1;
    for(let i = 0; i < syncedLyrics.length; i++){
      if(currentTime >= syncedLyrics[i].time){
        foundIndex = i;
      } else {
        break;
      }
    }

    if(foundIndex !== -1 && foundIndex !== currentLyricIndex){
      currentLyricIndex = foundIndex;
      displayLyric(currentLyricIndex);
    }
  });

  // Handle loop reset
  audio.addEventListener('seeked', () => {
    if(audio.currentTime < 1){
      currentLyricIndex = -1;
      layer.innerHTML = "";
    }
  });

  /* =========================================================
     INTERACTION / START
  ========================================================= */

  overlay.addEventListener('click', () => {
    overlay.classList.add('hidden');
    stage.classList.add('active');
    audio.play();
    bars.classList.add('playing');
  });

</script>

</body>
</html>
